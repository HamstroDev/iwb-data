name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Validate data
        run: python3 scripts/validate.py
      - name: Build dist
        run: python3 scripts/build.py dist
      - name: Push dist branch
        run: |
          cd dist
          git init --initial-branch=dist
          git config user.name "indie-wiki-buddy[bot]"
          git config user.email "317142361+indie-wiki-buddy[bot]@users.noreply.github.com"
          remote="https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          # Build on top of the existing dist history if the branch exists.
          if git fetch "$remote" dist; then
            git reset --soft FETCH_HEAD
          fi
          git add -A
          git commit -m "Build from ${GITHUB_SHA::7}"
          git push "$remote" HEAD:dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
