name: Validate and deploy

on:
  push:
    branches: [main]
  pull_request_target:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - name: Check out PR content
        if: github.event_name == 'pull_request_target'
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: pr
      - name: Use PR data with main's validator
        if: github.event_name == 'pull_request_target'
        run: |
          rm -rf data favicons
          mv pr/data data
          mv pr/favicons favicons
      - name: Validate data
        run: python3 scripts/validate.py

  deploy:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Build dist
        run: python3 scripts/build.py dist
      - name: Push dist branch
        run: |
          cd dist
          git init --initial-branch=dist
          git config user.name "indie-wiki-buddy[bot]"
          git config user.email "317142361+indie-wiki-buddy[bot]@users.noreply.github.com"
          remote="https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          # Build on top of the existing dist history if the branch exists.
          if git fetch "$remote" dist; then
            git reset --soft FETCH_HEAD
          fi
          git add -A
          git commit -m "Build from ${GITHUB_SHA::7}"
          git push "$remote" HEAD:dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
